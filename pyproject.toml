[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tp"
dynamic = ["version"]
description = "Predict transcripts from candidate start/stop sites in direct RNA sequencing reads"
readme = "README.md"
requires-python = ">=3.8"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Shaun Adkins", email = "sadkins@som.umaryland.edu"}]
dependencies = ["numpy>=1.20", "pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/Dunning-Hotopp-Lab/Direct_RNA_Sequencing"

[tool.setuptools]
py-modules = ["tp"]
script-files = ["tp.py"]

[tool.setuptools.dynamic]
version = {attr = "tp.__version__"}
